apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: autocompany-monitor
  namespace: monitoring
  labels:
    release: prometheus
spec:
  namespaceSelector:
    matchNames:
      - monitoring
  selector:
    matchLabels:
      app.kubernetes.io/name: kube-state-metrics
  endpoints:
    - port: http
      interval: 15s